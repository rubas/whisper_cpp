name: NIF check harness

on:
  push:
    branches:
      - nif-check-harness

permissions: {}

jobs:
  check:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: cr-x64, runner: ubuntu-22.04, body: generic, deps: none, repo: cloaked_req, tag: v0.8.1, file: libcloaked_req_native-v0.8.1-nif-2.17-x86_64-unknown-linux-gnu.so }
          - { id: cr-arm, runner: ubuntu-22.04-arm, body: generic, deps: none, repo: cloaked_req, tag: v0.8.1, file: libcloaked_req_native-v0.8.1-nif-2.17-aarch64-unknown-linux-gnu.so }
          - { id: cr-mac, runner: macos-15, body: generic, deps: none, repo: cloaked_req, tag: v0.8.1, file: libcloaked_req_native-v0.8.1-nif-2.17-aarch64-apple-darwin.so }
          - { id: ex-x64, runner: ubuntu-24.04, body: exmpeg, deps: codecs, repo: exmpeg, tag: v0.7.0, file: libexmpeg_native-v0.7.0-nif-2.17-x86_64-unknown-linux-gnu.so }
          - { id: ex-arm, runner: ubuntu-24.04-arm, body: exmpeg, deps: codecs, repo: exmpeg, tag: v0.7.0, file: libexmpeg_native-v0.7.0-nif-2.17-aarch64-unknown-linux-gnu.so }
          - { id: ex-mac, runner: macos-15, body: exmpeg, deps: none, repo: exmpeg, tag: v0.7.0, file: libexmpeg_native-v0.7.0-nif-2.17-aarch64-apple-darwin.so }
          - { id: cpp-x64, runner: ubuntu-24.04, body: cpp, deps: none, repo: whisper_cpp, tag: v0.5.1, file: libwhisper_cpp_native-v0.5.1-nif-2.17-x86_64-unknown-linux-gnu.so }
          - { id: cpp-x64-cuda, runner: ubuntu-24.04, body: cpp, deps: cuda, repo: whisper_cpp, tag: v0.5.1, file: libwhisper_cpp_native-v0.5.1-nif-2.17-x86_64-unknown-linux-gnu--cuda.so }
          - { id: cpp-x64-hip, runner: ubuntu-24.04, body: cpp, deps: rocm, repo: whisper_cpp, tag: v0.5.1, file: libwhisper_cpp_native-v0.5.1-nif-2.17-x86_64-unknown-linux-gnu--hipblas.so }
          - { id: cpp-arm, runner: ubuntu-24.04-arm, body: cpp, deps: none, repo: whisper_cpp, tag: v0.5.1, file: libwhisper_cpp_native-v0.5.1-nif-2.17-aarch64-unknown-linux-gnu.so }
          - { id: cpp-arm-cuda, runner: ubuntu-24.04-arm, body: cpp, deps: cuda, repo: whisper_cpp, tag: v0.5.1, file: libwhisper_cpp_native-v0.5.1-nif-2.17-aarch64-unknown-linux-gnu--cuda.so }
          - { id: cpp-mac, runner: macos-15, body: cpp, deps: none, repo: whisper_cpp, tag: v0.5.1, file: libwhisper_cpp_native-v0.5.1-nif-2.17-aarch64-apple-darwin.so }
          - { id: ct2-x64, runner: ubuntu-24.04, body: generic, deps: none, repo: whisper_ct2, tag: v0.7.1, file: libwhisper_ct2_native-v0.7.1-nif-2.17-x86_64-unknown-linux-gnu.so }
          - { id: ct2-x64-mkl, runner: ubuntu-24.04, body: generic, deps: none, repo: whisper_ct2, tag: v0.7.1, file: libwhisper_ct2_native-v0.7.1-nif-2.17-x86_64-unknown-linux-gnu--mkl.so }
          - { id: ct2-arm, runner: ubuntu-24.04-arm, body: generic, deps: none, repo: whisper_ct2, tag: v0.7.1, file: libwhisper_ct2_native-v0.7.1-nif-2.17-aarch64-unknown-linux-gnu.so }
          - { id: ct2-mac, runner: macos-15, body: generic, deps: none, repo: whisper_ct2, tag: v0.7.1, file: libwhisper_ct2_native-v0.7.1-nif-2.17-aarch64-apple-darwin.so }
    env:
      INSTALL_CUDA: ${{ matrix.deps == 'cuda' }}
      INSTALL_ROCM: ${{ matrix.deps == 'rocm' }}
    steps:
      - name: Install CUDA toolkit
        if: matrix.deps == 'cuda'
        env:
          ARCH: ${{ runner.arch == 'X64' && 'x86_64' || 'sbsa' }}
        run: |
          DISTRO=ubuntu2404
          KEYRING=cuda-keyring_1.1-1_all.deb
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/${DISTRO}/${ARCH}/${KEYRING}"
          sudo dpkg -i "${KEYRING}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cuda-toolkit-12-6
          echo "PATH=/usr/local/cuda/bin:$PATH" >> "$GITHUB_ENV"

      - name: Install ROCm / hipBLAS toolkit
        if: matrix.deps == 'rocm'
        run: |
          wget -q https://repo.radeon.com/amdgpu-install/7.2.4/ubuntu/noble/amdgpu-install_7.2.4.70204-1_all.deb
          sudo dpkg -i amdgpu-install_7.2.4.70204-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rocm-dev hipblas-dev rocblas-dev
          echo "PATH=/opt/rocm/bin:$PATH" >> "$GITHUB_ENV"
          echo "ROCM_PATH=/opt/rocm" >> "$GITHUB_ENV"

      - name: Install codec libraries
        if: matrix.deps == 'codecs'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmp3lame-dev libopus-dev libvpx-dev libwebp-dev

      - name: Download the released NIF
        env:
          REPO: ${{ matrix.repo }}
          TAG: ${{ matrix.tag }}
          FILE: ${{ matrix.file }}
        run: |
          mkdir nif
          curl -fsSL "https://github.com/rubas/$REPO/releases/download/$TAG/$FILE.tar.gz" | tar -xz -C nif
          ls -la nif
          echo "NIF=$PWD/nif/$FILE" >> "$GITHUB_ENV"
          echo "STAGE=$PWD/nif" >> "$GITHUB_ENV"
          echo "LIB_NAME=$FILE" >> "$GITHUB_ENV"

      - name: Diagnostics
        if: runner.os == 'Linux'
        run: |
          ls /etc/ld.so.conf.d/ && cat /etc/ld.so.conf.d/*.conf || true
          ls /usr/local/cuda/lib64/stubs 2>/dev/null || true
          ls /opt/rocm/lib 2>/dev/null | head -5 || true
          ldd -r "$NIF" 2>&1 | head -40 || true

      - name: Build a NIF that misses a symbol
        run: |
          printf 'extern void MKL_Free_Buffers(void);\nextern void *enif_alloc(unsigned long);\nvoid nif_body(void) { MKL_Free_Buffers(); enif_alloc(1); }\n' > bad.c
          if [ "$RUNNER_OS" = macOS ]; then
            cc -dynamiclib -undefined dynamic_lookup -o bad.so bad.c
          else
            cc -shared -fPIC -o bad.so bad.c
          fi

      - name: Check that the released NIF loads (generic)
        if: matrix.body == 'generic'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            REPORT="$(nm -m -u "$NIF")"
            MISSING="$(grep 'dynamically looked up' <<< "$REPORT" | grep -v ' _enif_' || true)"
          else
            REPORT="$(ldd -r "$NIF" 2>&1)" || { echo "$REPORT"; exit 1; }
            MISSING="$(grep -E 'not found|undefined symbol' <<< "$REPORT" | grep -v 'undefined symbol: enif_' || true)"
          fi
          if [ -n "$MISSING" ]; then
            echo "$MISSING"
            echo "::error::The NIF does not load: it needs the libraries or symbols above"
            exit 1
          fi
          

      - name: Check that the NIF that misses a symbol fails (generic)
        if: matrix.body == 'generic'
        shell: bash
        run: |
          cat > body.sh <<'BODY'
          if [ "$RUNNER_OS" = macOS ]; then
            REPORT="$(nm -m -u "$NIF")"
            MISSING="$(grep 'dynamically looked up' <<< "$REPORT" | grep -v ' _enif_' || true)"
          else
            REPORT="$(ldd -r "$NIF" 2>&1)" || { echo "$REPORT"; exit 1; }
            MISSING="$(grep -E 'not found|undefined symbol' <<< "$REPORT" | grep -v 'undefined symbol: enif_' || true)"
          fi
          if [ -n "$MISSING" ]; then
            echo "$MISSING"
            echo "::error::The NIF does not load: it needs the libraries or symbols above"
            exit 1
          fi
          
          BODY
          if RUNNER_TEMP=$(mktemp -d) NIF=$PWD/bad.so STAGE=$PWD LIB_NAME=bad.so bash --noprofile --norc -euo pipefail body.sh; then
            echo '::error::The check passed a NIF that misses MKL_Free_Buffers'
            exit 1
          fi

      - name: Check that the released NIF loads (cpp)
        if: matrix.body == 'cpp'
        shell: bash
        run: |
          if [ "$INSTALL_CUDA" = true ]; then
            # The runner has no NVIDIA driver. The toolkit's stub of its library stands in for it.
            ln -s /usr/local/cuda/lib64/stubs/libcuda.so "$RUNNER_TEMP/libcuda.so.1"
            export LD_LIBRARY_PATH="$RUNNER_TEMP"
          elif [ "$INSTALL_ROCM" = true ]; then
            export LD_LIBRARY_PATH="$ROCM_PATH/lib"
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            REPORT="$(nm -m -u "$NIF")"
            MISSING="$(grep 'dynamically looked up' <<< "$REPORT" | grep -v ' _enif_' || true)"
          else
            REPORT="$(ldd -r "$NIF" 2>&1)" || { echo "$REPORT"; exit 1; }
            MISSING="$(grep -E 'not found|undefined symbol' <<< "$REPORT" | grep -v 'undefined symbol: enif_' || true)"
          fi
          if [ -n "$MISSING" ]; then
            echo "$MISSING"
            echo "::error::The NIF does not load: it needs the libraries or symbols above"
            exit 1
          fi
          

      - name: Check that the NIF that misses a symbol fails (cpp)
        if: matrix.body == 'cpp'
        shell: bash
        run: |
          cat > body.sh <<'BODY'
          if [ "$INSTALL_CUDA" = true ]; then
            # The runner has no NVIDIA driver. The toolkit's stub of its library stands in for it.
            ln -s /usr/local/cuda/lib64/stubs/libcuda.so "$RUNNER_TEMP/libcuda.so.1"
            export LD_LIBRARY_PATH="$RUNNER_TEMP"
          elif [ "$INSTALL_ROCM" = true ]; then
            export LD_LIBRARY_PATH="$ROCM_PATH/lib"
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            REPORT="$(nm -m -u "$NIF")"
            MISSING="$(grep 'dynamically looked up' <<< "$REPORT" | grep -v ' _enif_' || true)"
          else
            REPORT="$(ldd -r "$NIF" 2>&1)" || { echo "$REPORT"; exit 1; }
            MISSING="$(grep -E 'not found|undefined symbol' <<< "$REPORT" | grep -v 'undefined symbol: enif_' || true)"
          fi
          if [ -n "$MISSING" ]; then
            echo "$MISSING"
            echo "::error::The NIF does not load: it needs the libraries or symbols above"
            exit 1
          fi
          
          BODY
          if RUNNER_TEMP=$(mktemp -d) NIF=$PWD/bad.so STAGE=$PWD LIB_NAME=bad.so bash --noprofile --norc -euo pipefail body.sh; then
            echo '::error::The check passed a NIF that misses MKL_Free_Buffers'
            exit 1
          fi

      - name: Check that the released NIF loads (exmpeg)
        if: matrix.body == 'exmpeg'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            REPORT="$(nm -m -u "${STAGE}/${LIB_NAME}")"
            if grep 'dynamically looked up' <<< "$REPORT" | grep -v ' _enif_' >&2; then
              echo "::error::The NIF does not load: it needs the symbols above" >&2
              exit 1
            fi
          else
            REPORT="$(env -u LD_LIBRARY_PATH ldd -r "${STAGE}/${LIB_NAME}" 2>&1)" || { echo "$REPORT" >&2; exit 1; }
            if grep -E 'not found|undefined symbol' <<< "$REPORT" | grep -v 'undefined symbol: enif_' >&2; then
              echo "::error::The NIF does not load: it needs the libraries or symbols above" >&2
              exit 1
            fi
          fi

      - name: Check that the NIF that misses a symbol fails (exmpeg)
        if: matrix.body == 'exmpeg'
        shell: bash
        run: |
          cat > body.sh <<'BODY'
          if [ "$RUNNER_OS" = macOS ]; then
            REPORT="$(nm -m -u "${STAGE}/${LIB_NAME}")"
            if grep 'dynamically looked up' <<< "$REPORT" | grep -v ' _enif_' >&2; then
              echo "::error::The NIF does not load: it needs the symbols above" >&2
              exit 1
            fi
          else
            REPORT="$(env -u LD_LIBRARY_PATH ldd -r "${STAGE}/${LIB_NAME}" 2>&1)" || { echo "$REPORT" >&2; exit 1; }
            if grep -E 'not found|undefined symbol' <<< "$REPORT" | grep -v 'undefined symbol: enif_' >&2; then
              echo "::error::The NIF does not load: it needs the libraries or symbols above" >&2
              exit 1
            fi
          fi
          BODY
          if RUNNER_TEMP=$(mktemp -d) NIF=$PWD/bad.so STAGE=$PWD LIB_NAME=bad.so bash --noprofile --norc -euo pipefail body.sh; then
            echo '::error::The check passed a NIF that misses MKL_Free_Buffers'
            exit 1
          fi
