name: "Setup whisper_cpp build env"
description: "Task, Elixir/OTP, Rust toolchain, sccache, and the mix/cargo/native caches."

inputs:
  elixir-version:
    description: "Elixir version"
    required: true
  otp-version:
    description: "OTP version"
    required: true
  rust-toolchain:
    description: "Rust toolchain version"
    required: true
  rust-components:
    description: "Comma-separated rustup components (e.g. 'rustfmt, clippy')"
    required: false
    default: ""
  cache-fixtures:
    description: "Set to 'true' to cache the integration-test fixtures"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    # No apt step: the GitHub-hosted Ubuntu image has cmake, gcc, make, pkg-config, and libclang. An apt step only adds
    # the Ubuntu mirror, which took 17 to 20 minutes on the ubuntu-26.04 image on 2026-10-23.
    - name: Install Task
      uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      with:
        version: 3.53.1
        # SHA256 of task_linux_amd64.tar.gz from the v3.53.1 task_checksums.txt.
        checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

    - name: Setup Elixir/OTP
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        elixir-version: ${{ inputs.elixir-version }}
        otp-version: ${{ inputs.otp-version }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        components: ${{ inputs.rust-components }}

    - name: Install sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

    - name: Enable sccache wrapping
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "CC=sccache cc" >> "$GITHUB_ENV"
        echo "CXX=sccache c++" >> "$GITHUB_ENV"

    - name: Cache Elixir build + deps
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          _build
          deps
        key: ${{ runner.os }}-mix-${{ inputs.elixir-version }}-${{ inputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ inputs.elixir-version }}-${{ inputs.otp-version }}-

    - name: Cache Cargo registry + git
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ inputs.rust-toolchain }}-${{ hashFiles('native/whisper_cpp_native/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ inputs.rust-toolchain }}-

    # bindgen tells cargo to rebuild whisper-rs-sys when a system header changes. A target from another Ubuntu
    # release names headers that are missing or newer here, so each run rebuilds whisper.cpp and saves nothing.
    - name: Read the runner image
      id: image
      shell: bash
      run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"

    - name: Cache native build artifacts (Cargo target + CMake)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          native/whisper_cpp_native/target
        key: ${{ steps.image.outputs.os }}-native-${{ inputs.rust-toolchain }}-${{ hashFiles('native/whisper_cpp_native/Cargo.lock') }}
        restore-keys: |
          ${{ steps.image.outputs.os }}-native-${{ inputs.rust-toolchain }}-

    - name: Cache integration fixtures (models)
      if: ${{ inputs.cache-fixtures == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          test/fixtures/ggml-tiny.en.bin
          test/fixtures/ggml-tiny.bin
          test/fixtures/ggml-silero-v5.1.2.bin
        key: ${{ runner.os }}-fixtures-${{ hashFiles('test/support/fixtures.ex') }}

    - name: Install Hex/Rebar + fetch deps
      shell: bash
      run: |
        mix local.hex --force
        mix local.rebar --force
        mix deps.get
