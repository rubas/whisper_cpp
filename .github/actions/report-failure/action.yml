name: "Report workflow failure"
description: "Open or comment on an issue when a workflow fails, and close it on the next green run."

inputs:
  result:
    description: "'failure' opens or comments on the issue, 'success' closes it"
    required: true
  title:
    description: "Issue title; it identifies the issue across runs"
    required: true
  subject:
    description: "What failed, in lower case, for the issue text (e.g. 'security audit')"
    required: true
  labels:
    description: "JSON array of {name, color, description} for a new issue; missing labels are created"
    required: false
    default: "[]"

runs:
  using: "composite"
  steps:
    - name: Open or close the issue
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        RESULT: ${{ inputs.result }}
        TITLE: ${{ inputs.title }}
        SUBJECT: ${{ inputs.subject }}
        LABELS: ${{ inputs.labels }}
      with:
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const { RESULT: result, TITLE: title, SUBJECT: subject } = process.env;
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          if (result === 'failure') {
            const labels = JSON.parse(process.env.LABELS);
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, ...label });
              }
            }
            const date = new Date().toISOString().split('T')[0];
            const body = `The ${subject} failed on ${date}. See the [workflow run](${runUrl}).`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: labels.map(label => label.name).join(','), per_page: 100,
            });
            const existing = open.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title, body, labels: labels.map(label => label.name),
              });
            }
          } else if (result === 'success') {
            const passed = subject.charAt(0).toUpperCase() + subject.slice(1);
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            });
            for (const issue of open.filter(i => i.title === title)) {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: issue.number,
                body: `${passed} passed. Closing. See the [workflow run](${runUrl}).`,
              });
              await github.rest.issues.update({
                owner, repo,
                issue_number: issue.number, state: 'closed',
              });
            }
          } else {
            throw new Error(`result must be 'failure' or 'success', got '${result}'`);
          }
